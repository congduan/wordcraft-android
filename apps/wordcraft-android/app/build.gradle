plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.storyteller.wordcraft.android'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.storyteller.wordcraft.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.7.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
}

def prebuiltRust = providers.gradleProperty('android.prebuilt').map { it.toBoolean() }.orElse(false)

tasks.register('buildRust', Exec) {
    group = 'build'
    description = 'Build the WordCraft Rust NativeActivity library for Android ABIs.'
    onlyIf { !prebuiltRust.get() }
    workingDir rootProject.projectDir
    environment 'ANDROID_NDK_HOME', '/opt/android-sdk/ndk/27.2.12479018'
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'armeabi-v7a', '-o',
        'app/src/main/jniLibs', 'build', '--release', '-p', 'wordcraft-android'
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('buildRust'))
}
